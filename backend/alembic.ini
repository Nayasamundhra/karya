# Alembic configuration for Karya.
#
# NOTE: `sqlalchemy.url` is intentionally absent. The URL is injected at
# runtime by alembic/env.py from the application settings, so no credential
# ever lives in a committed file.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# Migration filenames: 20260813_1430_<rev>_<slug>.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
# Keep at WARNING: the INFO level echoes SQL, which can contain sensitive data.
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
