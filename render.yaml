# Render Blueprint for the Karya backend.
#
# Create this service via Render's dashboard: New -> Blueprint -> point at
# this repo. Render reads this file and provisions the service below,
# prompting once for every `sync: false` value (never stored in git). See
# backend/docs/DEPLOYMENT.md for the full walkthrough and where each value
# comes from.
#
# autoDeploy is deliberately false: deploys are triggered by
# .github/workflows/backend.yml's deploy hook step, only after the test job
# (pytest against real Postgres) and the migration step have both
# succeeded — not on every push Render sees.

services:
  - type: web
    name: karya-api # rename to match whatever you picked in Part 1 of the plan
    runtime: docker
    plan: free
    region: oregon # pick whichever region is closest to you / your Neon project
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Adds --proxy-headers so uvicorn trusts Render's edge proxy for the
    # real client IP (used by the per-IP rate limiter); Render's edge is the
    # only way to reach this container, there's no other public entry
    # point. See "Part 3" of the deployment plan for the trade-off this
    # documents in backend/docs/PRODUCTION.md.
    dockerCommand: >-
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      --timeout-graceful-shutdown 30 --no-access-log
      --proxy-headers --forwarded-allow-ips=*
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_FORMAT
        value: json
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USE_TLS
        value: "true"
      # Everything below is either a secret or specific to your deployment
      # (a URL/host/credential I don't have) — Render will prompt for these
      # once when you create the Blueprint, and they're stored in Render's
      # own secret store, never in this file or in git.
      - key: JWT_SECRET_KEY
        sync: false # generate with: python -c "import secrets; print(secrets.token_urlsafe(48))"
      - key: DATABASE_URL
        sync: false # Neon's *direct* (non-pooled) connection string
      - key: CORS_ALLOWED_ORIGINS
        sync: false # https://<your-vercel-project>.vercel.app
      - key: PUBLIC_APP_URL
        sync: false # same Vercel URL as above
      - key: SMTP_HOST
        sync: false # from Brevo
      - key: SMTP_USERNAME
        sync: false # from Brevo
      - key: SMTP_PASSWORD
        sync: false # Brevo SMTP key, not your account password
      - key: SMTP_FROM_ADDRESS
        sync: false # the sender address you verified with Brevo
