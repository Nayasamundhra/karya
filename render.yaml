# Render Blueprint for the Karya backend.
#
# Create this service via Render's dashboard: New -> Blueprint -> point at
# this repo. Render reads this file and provisions the service below,
# prompting once for every `sync: false` value (never stored in git). See
# backend/docs/DEPLOYMENT.md for the full walkthrough and where each value
# comes from.
#
# autoDeploy is deliberately false: deploys are triggered by
# .github/workflows/backend.yml's deploy hook step, only after the test job
# (pytest against real Postgres) and the migration step have both
# succeeded — not on every push Render sees.

services:
  - type: web
    name: karya-api # rename to match whatever you picked in Part 1 of the plan
    runtime: docker
    plan: free
    region: oregon # pick whichever region is closest to you / your Neon project
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Adds --proxy-headers so uvicorn trusts Render's edge proxy for the
    # real client IP (used by the per-IP rate limiter); Render's edge is the
    # only way to reach this container, there's no other public entry
    # point. See "Part 3" of the deployment plan for the trade-off this
    # documents in backend/docs/PRODUCTION.md.
    dockerCommand: >-
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      --timeout-graceful-shutdown 30 --no-access-log
      --proxy-headers --forwarded-allow-ips=*
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_FORMAT
        value: json
      # Everything below is either a secret or specific to your deployment
      # (a URL/host/credential I don't have) — Render will prompt for these
      # once when you create the Blueprint, and they're stored in Render's
      # own secret store, never in this file or in git.
      - key: JWT_SECRET_KEY
        sync: false # generate with: python -c "import secrets; print(secrets.token_urlsafe(48))"
      - key: DATABASE_URL
        sync: false # Neon's *direct* (non-pooled) connection string
      - key: CORS_ALLOWED_ORIGINS
        sync: false # https://<your-vercel-project>.vercel.app
      - key: PUBLIC_APP_URL
        sync: false # same Vercel URL as above
      # Brevo's HTTP API, not SMTP: verified directly that Render's free tier
      # blocks outbound SMTP entirely (a real send attempt hung until timeout
      # and never reached smtp-relay.brevo.com), so SMTP_HOST/USERNAME/
      # PASSWORD are deliberately not configured here even though the app
      # supports them - see app/services/email/mailer.py and
      # backend/docs/DEPLOYMENT.md.
      - key: BREVO_API_KEY
        sync: false # Brevo -> SMTP & API -> API Keys tab (not the SMTP tab)
      - key: SMTP_FROM_ADDRESS
        sync: false # the sender address you verified with Brevo

  # Forgotten-checkout safety net (see backend/app/jobs/close_stale_sessions.py
  # and CLAUDE.md's "forgotten checkout" section). The in-band path -
  # `record_attendance` auto-closing a stale CHECK_IN the moment the same
  # person next checks in or out - handles the common case with no help from
  # this job. This cron exists only for the tail case: someone who never
  # comes back at all, whose row nothing else would ever touch, so their
  # team's dashboard would otherwise show them as CHECKED_IN indefinitely.
  # Added because that gap existed in this deployment with nothing running
  # the sweep at all - see backend/docs/DEPLOYMENT.md §7.
  #
  # I'm not fully certain of Render's current Cron Job pricing/free-tier
  # limits (they change over time, same caveat backend/docs/DEPLOYMENT.md
  # already states for the web service's free plan) - verify on Render's own
  # pricing page before relying on the `plan: free` line below.
  - type: cron
    name: karya-close-stale-sessions
    runtime: docker
    plan: free
    region: oregon # match the web service's region above
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: python -m app.jobs.close_stale_sessions
    # Hourly: frequent enough that a forgotten checkout is visible within
    # about an hour of crossing the tenant's own
    # `attendance_locations.max_shift_hours`, cheap enough that the common
    # case (nothing stale to close - see close_stale_sessions.py) costs
    # nothing. Adjust if that trade-off doesn't fit your tenants.
    schedule: "0 * * * *"
    envVars:
      # `app.core.config.Settings` runs its full production validation for
      # *any* process that imports it, including this one - even though the
      # sweep itself only ever reads DATABASE_URL. So this needs the same
      # env vars as the web service above, not just the one it uses; see
      # that service's comments for what each is and where it comes from.
      # Render's Blueprint spec supports sharing an env var group across
      # services if you'd rather not keep two copies of these in sync by
      # hand - check Render's current docs for the exact syntax, since it
      # wasn't re-verified for this file.
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_FORMAT
        value: json
      - key: JWT_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_FROM_ADDRESS
        sync: false
