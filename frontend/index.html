<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Karya — multi-tenant staff attendance with server-verified presence." />

    <!-- iOS has no equivalent of the web app manifest's `display: standalone`
         without these meta tags — Android reads the manifest directly.
         See docs/pwa.md for the full platform-support table. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Karya" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <!-- The token file has named 'Inter' as the body face since Phase 8, but
         nothing ever loaded it — every render silently fell through to the
         OS's own sans-serif. This actually loads it, plus 'Outfit' for the
         redesign's large hero moments (a check-in timer, the kiosk clock) —
         see styles/index.css's --font-display. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <title>Karya</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
